// Resolve store secrets once, at android-block scope, so both `defaultConfig`
// (which injects them into the manifest / BuildConfig) and the release secret
// guard below (#1915) can see the same resolved values.
//
// Each key is read from one of:
//   1. its environment variable (CI / store-bound builds)
//   2. repo-root local.properties (developer machines)
//   3. fallback empty string (the feature stays disabled at runtime — and the
//      #1915 release guard refuses to ship a store APK in that state)
def loadFromLocalProperties = { String propertyName ->
    def localPropsFile = rootProject.file("local.properties")
    if (!localPropsFile.exists()) {
        return ""
    }
    def localProps = new Properties()
    localPropsFile.withInputStream { localProps.load(it) }
    return localProps.getProperty(propertyName, "")
}



android {
    namespace = "io.github.sceneview.demo"

    // Align native library ELF load segments to 16 KB so Google Play accepts
    // the AAB on 16 KB-page-size devices (Android 15+, enforced by Play Store
    // since Jan 2026 for existing-app updates). Filament ships prebuilt .so
    // files; this property rewrites ELF PT_LOAD alignment headers at pack time.
    // AGP internal key: ModulePropertyKey.OptionalString.NATIVE_LIBRARY_PAGE_SIZE
    // Accepted values: "4k" (default), "16k", "64k".
    experimentalProperties["android.nativeLibraryAlignmentPageSize"] = "16k"

    compileSdk 36
    ndkVersion "30.0.14904198"


    defaultConfig {
        applicationId "io.github.sceneview.demo"
        minSdk 31
        targetSdk 36
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.property('versionName') : (project.findProperty('VERSION_NAME') ?: "1.0.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                targets "splat_capture_jni"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            // Populated from environment variables or local.properties
            def keystoreFile = System.getenv("SCENEVIEW_DEMO_KEYSTORE_FILE")
            def keystorePass = System.getenv("SCENEVIEW_DEMO_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("SCENEVIEW_DEMO_KEY_ALIAS")
            def keyPass = System.getenv("SCENEVIEW_DEMO_KEY_PASSWORD")

            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("SCENEVIEW_DEMO_KEYSTORE_FILE")
            if (keystoreFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }
    buildFeatures {
        compose = true
        buildConfig = true
        prefab = true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    androidResources {
        // `.filamat` and `.ktx` are already compressed payloads — re-zipping
        // them in the APK only wastes CPU. `.glb` and `.hdr` stay compressible:
        // the demo GLBs are Draco + WebP packed and the HDRs are RGBE, both of
        // which the APK zip stage still shrinks meaningfully.
        noCompress 'filamat', 'ktx'
    }
    packaging {
        resources {
            // Drop duplicate transitive licence / metadata files that several
            // AndroidX artifacts each ship — pure dead weight in the APK.
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/androidx/**',
                'META-INF/{AL2.0,LGPL2.1}',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'kotlin/**',
                'DebugProbesKt.bin',
            ]
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.logging.enabled', 'true'
            }
        }
    }
}

dependencies {
    // Compose BOM
    implementation platform(libs.androidx.compose.bom)

    implementation project(":samples:common")

    // Compose (extras beyond what :samples:common provides)
    implementation libs.androidx.compose.material.icons.extended
    // Material 3 Expressive APIs (alpha, newer than BOM's stable release)
    implementation libs.androidx.compose.material3.expressive

    // Compose @Preview annotation — needed at compile time so the AS preview pane and
    // Roborazzi snapshot tests can discover @Preview functions on the demos.
    implementation libs.androidx.compose.ui.tooling.preview
    // ui-tooling provides the runtime that renders @Preview functions in the AS pane;
    // shipping it in debug only avoids bundling the inspector into release APKs.
    debugImplementation libs.androidx.compose.ui.tooling

    // SceneView — 3D + AR
    implementation project(":sceneview")
    implementation project(":arsceneview")

    // Google Play In-App Updates — Play Core deps come via :samples:common
    // (`api libs.play.app.update*`). Manager + banner live in
    // `io.github.sceneview.sample.common.update.*`.

    // JSON serialization for splat capture and training metadata
    implementation libs.kotlinx.serialization.json

    // Unit testing
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.junit
    testImplementation platform(libs.androidx.compose.bom)
    testImplementation libs.androidx.compose.ui
    testImplementation libs.kotlin.coroutines.test

    // UiAutomator-based interaction tests. Drives the real demo app process through
    // DemoHostActivity (debug flavour) — no ComposeTestRule, no Filament thread-adoption
    // races. Screenshots grabbed via UiDevice cover the full framebuffer including the
    // SurfaceView that Compose's captureToImage() cannot see.
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.uiautomator

	// Brush splat training library
	implementation files('libs/brush-aar-release.aar')

    // LiteRT dependencies for Async AI Depth
    implementation 'com.google.ai.edge.litert:litert:2.1.6'

    // Storage Access Framework DocumentFile helper
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

task downloadXFeatModel {
    def modelFile = file("src/main/assets/xfeat_fp16.tflite")
    outputs.file(modelFile)

    doLast {
        if (!modelFile.exists()) {
            logger.lifecycle("Downloading xfeat_fp16.tflite model from Hugging Face...")
            modelFile.parentFile.mkdirs()
            new URL("https://huggingface.co/litert-community/xfeat-litert/resolve/main/xfeat_fp16.tflite").withInputStream { i ->
                modelFile.withOutputStream { it << i }
            }
            logger.lifecycle("✅ Downloaded xfeat_fp16.tflite successfully.")
        }
    }
}

// ─── Generated demo registry (issue #1976) ───────────────────────────────
//
// `GeneratedDemos.kt` is the collated output of the append-only DemoRegistry
// fragments (#1797). It used to be committed, which guaranteed a merge conflict
// on every parallel demo-adding PR. It is now `.gitignore`d and regenerated at
// build time by this task.
//
// This is a portable Groovy implementation that replaces the bash-based
// collator for the Gradle build path, ensuring it works on Windows without
// needing a shell environment (issue #2041).
def fragmentsDir = file("src/main/java/io/github/sceneview/demo/fragments")
def valuesDir = file("src/main/res/values")
def generatedDemosFile = file("src/main/java/io/github/sceneview/demo/fragments/GeneratedDemos.kt")

/**
 * Portable implementation of the demo registry collator.
 * Replaces the need for bash/grep/sed on Windows.
 */
def getDemoMetadata = {
    def fragments = []
    fragmentsDir.eachFileMatch(~/.*Fragment\.kt/) { file ->
        if (file.name == "DemoFragment.kt") return
        def text = file.text

        // Use matches strategy that works with Groovy's Matcher capture groups
        def objMatcher = (text =~ /(?m)^object\s+([A-Za-z0-9_]+Fragment)\b/)
        def idMatcher = (text =~ /id\s*=\s*"([^"]+)"/)
        def titleMatcher = (text =~ /titleRes\s*=\s*R\.string\.([a-zA-Z0-9_]+)/)
        def subtitleMatcher = (text =~ /subtitleRes\s*=\s*R\.string\.([a-zA-Z0-9_]+)/)
        def categoryMatcher = (text =~ /category\s*=\s*DemoCategory\.([A-Z_0-9]+)/)

        if (objMatcher.find() && idMatcher.find()) {
            fragments << [
                    obj: objMatcher.group(1),
                    id: idMatcher.group(1),
                    titleRes: titleMatcher.find() ? titleMatcher.group(1) : null,
                    subtitleRes: subtitleMatcher.find() ? subtitleMatcher.group(1) : null,
                    category: categoryMatcher.find() ? categoryMatcher.group(1) : null
            ]
        }
    }
    fragments.sort { it.id }

    // Duplicate check
    def dupes = fragments.groupBy { it.id }.findAll { it.value.size() > 1 }
    if (dupes) throw new GradleException("Duplicate demo ids found: ${dupes.keySet()}")

    return fragments
}

def generateDemoRegistry = tasks.register("generateDemoRegistry") {
    description = "Regenerates GeneratedDemos.kt from fragments (Portable implementation)."
    group = "build"

    inputs.dir(fragmentsDir)
    outputs.file(generatedDemosFile)

    doLast {
        def fragments = getDemoMetadata()
        def sb = new StringBuilder()
        sb.append("// AUTO-GENERATED by generateDemoRegistry in build.gradle — DO NOT EDIT.\n")
        sb.append("//\n")
        sb.append("// This file is regenerated from every `*Fragment.kt` under\n")
        sb.append("// `src/main/java/io/github/sceneview/demo/fragments/`. To add or remove a demo,\n")
        sb.append("// add or remove a fragment file and rebuild; never edit this file\n")
        sb.append("// by hand.\n")
        sb.append("package io.github.sceneview.demo.fragments\n\n")
        sb.append("import androidx.compose.runtime.Composable\n")
        sb.append("import io.github.sceneview.demo.DemoEntry\n\n")
        sb.append("/**\n")
        sb.append(" * Generated aggregate of every [DemoFragment] declared under\n")
        sb.append(" * `io.github.sceneview.demo.fragments`. Drives [io.github.sceneview.demo.ALL_DEMOS]\n")
        sb.append(" * and [io.github.sceneview.demo.DemoRouter].\n")
        sb.append(" */\n")
        sb.append("object GeneratedDemos {\n")
        sb.append("    /** All fragments, sorted by demo id. */\n")
        sb.append("    val fragments: List<DemoFragment> = listOf(\n")
        fragments.each { sb.append("        ${it.obj},\n") }
        sb.append("    )\n\n")
        sb.append("    /** Convenience: every demo's metadata, in the same order as [fragments]. */\n")
        sb.append("    val all: List<DemoEntry> = fragments.map { it.entry }\n\n")
        sb.append("    /**\n")
        sb.append("     * Returns the composable for the demo with the given [id], or `null` if no\n")
        sb.append("     * fragment registers that id.\n")
        sb.append("     */\n")
        sb.append("    @Composable\n")
        sb.append("    fun Screen(id: String, onBack: () -> Unit): Boolean {\n")
        sb.append("        when (id) {\n")
        fragments.each { sb.append("            \"${it.id}\" -> ${it.obj}.Screen(onBack)\n") }
        sb.append("            else -> return false\n")
        sb.append("        }\n")
        sb.append("        return true\n")
        sb.append("    }\n")
        sb.append("}\n")

        def newContent = sb.toString()
        if (!generatedDemosFile.exists() || generatedDemosFile.text != newContent) {
            generatedDemosFile.text = newContent
            logger.lifecycle("✅ Regenerated GeneratedDemos.kt from ${fragments.size()} fragments.")
        }
    }
}


// Make every Kotlin compilation (debug/release, app + unit tests) depend on the
// generator so a fresh checkout always has GeneratedDemos.kt before kotlinc runs.
tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Kotlin") }.configureEach {
    dependsOn(generateDemoRegistry)
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(generateDemoRegistry)
    dependsOn(downloadXFeatModel)
}
