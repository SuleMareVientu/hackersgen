name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this bug affect?
      options:
        - samples:android-demo (OpenSplat demo & training app)
        - sceneview (3D Compose runtime)
        - arsceneview (ARCore Compose integration)
        - sceneview-core (Math & collision core)
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: "Pixel 8 Pro — Android 15"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Paste the smallest code snippet that reproduces the bug, or step-by-step instructions.
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
      description: Drag and drop images or videos here if applicable.
