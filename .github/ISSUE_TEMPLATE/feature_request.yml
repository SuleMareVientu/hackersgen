name: Feature request
description: Suggest a new feature or API improvement
labels: [enhancement]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module is this feature request for?
      options:
        - samples:android-demo (OpenSplat demo & training app)
        - sceneview (3D Compose runtime)
        - arsceneview (ARCore Compose integration)
        - sceneview-core (Math & collision core)
        - Other (samples, docs)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Description
      description: What problem does this solve? Describe the use case or limitation you're hitting.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behaviour
      description: Show what the code or API would look like with your proposed change.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered? Why are they insufficient?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself (see [CONTRIBUTING.md](../CONTRIBUTING.md))
